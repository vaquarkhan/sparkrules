site_name: SparkRules
site_url: https://sparkrules.readthedocs.io
site_description: "Drools-style business rule engine for Python"
site_author: Vaquar Khan
repo_url: https://github.com/vaquarkhan/sparkrules
repo_name: vaquarkhan/sparkrules

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Install: install.md
    - Quick Start: quickstart.md
  - Features:
    - Overview: FEATURES.md
    - Rule Engine: HOW_IT_WORKS.md
    - Use Cases: USE_CASES.md
    - Spark Integration: SPARK_INTEGRATION.md
  - API & Workbench:
    - Developer Guide: DEVELOPER_GUIDE.md
    - Governance: GOVERNANCE.md
    - Benchmarks: BENCHMARKS.md
  - Operations:
    - Architecture Scope: KNOWN_LIMITATIONS.md
    - Comparison vs Alternatives: SPARKRULES_VS_THE_WORLD.md
    - Publishing: PUBLISHING.md
    - Roadmap: ROADMAP.md
