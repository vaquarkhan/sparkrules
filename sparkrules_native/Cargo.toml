[package]
name = "sparkrules_native"
version = "0.1.0"
edition = "2021"
description = "Native Rust accelerator for sparkrules (local/driver mode)."
license = "Apache-2.0"
repository = "https://github.com/vaquarkhan/sparkrules"

[lib]
name = "sparkrules_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
