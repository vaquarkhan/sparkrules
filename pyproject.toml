[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkrules"
version = "1.1.0"
description = "Drools-equivalent business rule engine reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "business-rules",
  "rule-engine",
  "drools",
  "drl",
  "decision-table",
  "spark",
  "fastapi",
  "pyspark",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Office/Business",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
lakehouse = [
  "pyiceberg>=0.8",
  "pyarrow>=14",
]
store = [
  "duckdb>=1.1.0",
  "psycopg[binary]>=3.2",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "httpx>=0.27,<0.28",
]
spark = [
  "pyspark>=3.5.0",
]
tecton = [
  "tecton-client>=0.4",
]
# sparkrules-native wheels are not published to PyPI yet (see docs/NATIVE_TIER1.md).
# pip install sparkrules[native] currently installs no extra deps; build from sparkrules_native/
# or use CI wheel artifacts. After PyPI publish, restore:
# native = ["sparkrules-native>=0.1.0,<1.0"]
native = []
all = [
  "sparkrules[api,spark,store]",
]
test = [
  "sparkrules[api]",
  "sparkrules[store]",
  "pytest>=8.0",
  "hypothesis>=6.100",
  "httpx>=0.27,<0.28",
  "pytest-cov>=4.0",
  "pyarrow>=14",
  "pyspark>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/vaquarkhan/sparkrules"
Documentation = "https://sparkrules.readthedocs.io"
Changelog = "https://github.com/vaquarkhan/sparkrules/blob/main/CHANGELOG.md"
Issues = "https://github.com/vaquarkhan/sparkrules/issues"
Repository = "https://github.com/vaquarkhan/sparkrules"

[project.scripts]
sparkrules-drl-smoke = "sparkrules.tools.smoke_drl:main"
sparkrules-cli = "sparkrules.tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# Prefix "sparkrules" alone only lists the root package — subpackages (e.g. sparkrules.native)
# are omitted from sdist/wheel. "sparkrules*" matches the full tree under src/sparkrules/.
include = ["sparkrules*"]

[tool.setuptools.package-data]
sparkrules = [
  "py.typed",
  "api/static/workbench/index.html",
  "api/static/workbench/sparkrules-logo.png",
  "api/static/workbench/favicon.ico",
  "api/static/workbench/sample_facts.csv",
  "api/static/workbench/sample_facts.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not perf'"
markers = [
  "property: property-based tests (hypothesis)",
  "integration: integration use-case tests",
  "slow: long-running tests",
  "perf: opt-in performance benchmarks (run with -m perf)",
  "spark: requires PySpark and a Java runtime (local[*] in tests)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E741"]  # allow 'l' as variable name in parser code

[tool.ruff.lint.per-file-ignores]
"src/sparkrules/**/__init__.py" = ["F401"]  # re-exports
"src/sparkrules/policy/ranger_compat.py" = ["E402"]  # imports after docstring
"tests/**/*.py" = ["F401", "F841", "E402"]  # test imports and unused vars

[tool.coverage.run]
source = ["src/sparkrules"]
branch = false

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "# V1 legacy path",
]

