[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkrules"
version = "0.1.0"
description = "Drools-equivalent business rule engine reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "openpyxl>=3.1",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "httpx>=0.27,<0.28",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "httpx",
  "pytest-cov>=4.0",
  "pyspark>=3.5.0",
]

[project.scripts]
sre-drl-smoke = "sre.tools.smoke_drl:main"
sre-cli = "sre.tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sre = [
  "api/static/workbench/index.html",
  "api/static/workbench/sparkrules-logo.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not perf'"
markers = [
  "property: property-based tests (hypothesis)",
  "integration: integration use-case tests",
  "slow: long-running tests",
  "perf: opt-in performance benchmarks (run with -m perf)",
  "spark: requires PySpark and a Java runtime (local[*] in tests)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["src/sre"]
branch = false

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]

