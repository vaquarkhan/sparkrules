# Build sdist + wheel. Publish to PyPI on: (1) manual workflow with checkbox, or (2) push of tag v* (e.g. v0.2.0).
# See docs/PUBLISHING.md for trusted publishing and the `pypi` GitHub environment.
name: Release build

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Upload dist/ to PyPI (trusted publishing; requires pypi environment)"
        required: false
        type: boolean
        default: false
  push:
    tags: [ "v*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test (same gates as CI)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
          python -m pytest --cov=sparkrules --cov-report=term

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
