# Verifies a source distribution and wheel can be built. Upload to PyPI is manual or via trusted publishing in your org.
name: Release build

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
