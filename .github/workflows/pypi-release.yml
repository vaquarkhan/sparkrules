name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Run tests, build wheel/sdist, and upload to PyPI (uncheck only for dry-run)"
        required: false
        default: true
        type: boolean
      python_version:
        description: "Python version used for test + build"
        required: false
        default: "3.11"
        type: string

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-intent:
    runs-on: ubuntu-latest
    steps:
      - name: Publish to PyPI must be enabled
        if: ${{ !inputs.publish_to_pypi }}
        run: |
          echo "::error title=Publish disabled::Enable publish_to_pypi (checkbox under Run workflow) or PyPI Release does nothing."
          exit 1
      - name: Continuing to test/build/publish
        if: ${{ inputs.publish_to_pypi }}
        run: echo "publish_to_pypi=yes"

  test:
    needs: [publish-intent]
    if: ${{ inputs.publish_to_pypi }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install and test (same gates as CI)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
          python -m pytest --cov=sparkrules --cov-report=term

  build:
    if: ${{ inputs.publish_to_pypi }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: ${{ inputs.publish_to_pypi }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
