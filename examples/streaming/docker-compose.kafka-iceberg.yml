# Local development stack for SparkRules Kafka → Iceberg pipeline
# Author: Ram Ghadiyaram
#
# Services:
#   - Kafka (KRaft mode, no ZooKeeper)
#   - MinIO (S3-compatible storage for Iceberg warehouse)
#   - Optional schema-registry (commented; enable if you switch to Avro)
#
# Usage:
#   docker compose up -d
#   # wait ~15s for Kafka to be ready
#   python producer/sample_producer.py --count 20
#   # then run the Spark job pointing at localhost:9092 and the MinIO warehouse

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: sparkrules-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sparkrules-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot helper that creates the Iceberg warehouse bucket
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/warehouse;
      mc anonymous set download local/warehouse;
      echo 'MinIO bucket warehouse ready';
      "

volumes:
  minio_data:
